# check(typecheck+lint+test)は全 push / PR。重い配布ビルド(win/mac)はタグと
# 手動のときだけ。以前はタグを打つまで一度もテストが走らず、リリース直前に
# 初めて赤くなっていた(v0.5.0 の libm 丸め差、v0.5.2 のソーク lag が実例)。
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# @playwright/test は playwright に依存し、その postinstall が Chromium/Firefox/
# WebKit(約500MB)を落とす。_electron.launch はアプリ自身の Electron を使うので
# 1つも要らない。**全ジョブ**で止める — check / win / mac の npm ci が無関係に
# 1〜3分遅くなるのを防ぐ。
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

concurrency:
  # PR の古い実行は打ち切る。タグのリリースビルドは途中で殺さない。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 軽い検証。ubuntu を使うのは windows ランナーの2倍速く課金単価も半分だから —
  # テスト対象は node:sqlite と純ロジックだけでプラットフォーム依存が無い
  # (配布物そのものの検証は下の win / mac ジョブが担う)。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # typecheck は従来タグ時の `npm run build` の中でしか走っていなかった。
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # 実アプリ(Electron)起動の E2E。全 push / PR ではスモークだけ回す —
  # 「Electron が起動し worker が上がり RPC が往復する」という最も壊れやすい
  # 配線を守るのが目的で、フルは下の win(タグ時)が持つ。
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Electron は headless モードを持たない(Chromium と違う)。BrowserWindow に X が要る。
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # -a は空いている :N を自動で選ぶ。--no-sandbox は ubuntu 24.04 の AppArmor が
      # 非特権 user namespace を制限して zygote が起動できないため(fixtures.ts 側で付与)。
      - run: xvfb-run -a npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-linux
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  win:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # lint とテストをリリースのゲートにする — typecheck だけでは実行時バグを通す。
      - run: npm run lint
      - run: npm test
      # 実際の配布先は Windows。monitor-window.ts の全画面分岐や node:sqlite の
      # Windows パスはここでしか通らない。導入初期は continue-on-error で
      # リリースを止めない(安定を確認したら外す)。
      - run: npm run test:e2e
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-win
          path: playwright-report/
          retention-days: 7
      # THIRD-PARTY-NOTICES.md is gitignored — regenerate it or the in-app
      # licenses pane ships empty.
      - run: npm run notices
      - run: npm run release:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*/*Setup*.exe
            release/*/*Portable*.exe
            release/*/tiktok-live-stats-source-*.zip

  mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      # No Developer ID cert: skip keychain discovery. electron-builder then
      # ad-hoc signs, which is REQUIRED for Apple Silicon (a fully unsigned
      # arm64 binary is killed by the kernel).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run notices
      - run: npm run release:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*/*-mac-universal.dmg
            release/*/tiktok-live-stats-source-*.zip

  # Draft a GitHub Release with both platforms' artifacts on tag push.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [win, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '**/*'
          draft: true
