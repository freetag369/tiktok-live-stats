# Windows + macOS release builds. Trigger: tag push (v*) or manual dispatch.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # THIRD-PARTY-NOTICES.md is gitignored — regenerate it or the in-app
      # licenses pane ships empty.
      - run: npm run notices
      - run: npm run release:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*/*Setup*.exe
            release/*/*Portable*.exe
            release/*/tiktok-live-stats-source-*.zip

  mac:
    runs-on: macos-latest
    env:
      # No Developer ID cert: skip keychain discovery. electron-builder then
      # ad-hoc signs, which is REQUIRED for Apple Silicon (a fully unsigned
      # arm64 binary is killed by the kernel).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run notices
      - run: npm run release:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*/*-mac-universal.dmg
            release/*/tiktok-live-stats-source-*.zip

  # Draft a GitHub Release with both platforms' artifacts on tag push.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [win, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '**/*'
          draft: true
