# check(typecheck+lint+test)は全 push / PR。重い配布ビルド(win/mac)はタグと
# 手動のときだけ。以前はタグを打つまで一度もテストが走らず、リリース直前に
# 初めて赤くなっていた(v0.5.0 の libm 丸め差、v0.5.2 のソーク lag が実例)。
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  # PR の古い実行は打ち切る。タグのリリースビルドは途中で殺さない。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 軽い検証。ubuntu を使うのは windows ランナーの2倍速く課金単価も半分だから —
  # テスト対象は node:sqlite と純ロジックだけでプラットフォーム依存が無い
  # (配布物そのものの検証は下の win / mac ジョブが担う)。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # typecheck は従来タグ時の `npm run build` の中でしか走っていなかった。
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  win:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # lint とテストをリリースのゲートにする — typecheck だけでは実行時バグを通す。
      - run: npm run lint
      - run: npm test
      # THIRD-PARTY-NOTICES.md is gitignored — regenerate it or the in-app
      # licenses pane ships empty.
      - run: npm run notices
      - run: npm run release:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*/*Setup*.exe
            release/*/*Portable*.exe
            release/*/tiktok-live-stats-source-*.zip

  mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      # No Developer ID cert: skip keychain discovery. electron-builder then
      # ad-hoc signs, which is REQUIRED for Apple Silicon (a fully unsigned
      # arm64 binary is killed by the kernel).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run notices
      - run: npm run release:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*/*-mac-universal.dmg
            release/*/tiktok-live-stats-source-*.zip

  # Draft a GitHub Release with both platforms' artifacts on tag push.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [win, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '**/*'
          draft: true
